name: Deploy to cPanel FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy via FTP to cPanel
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build project
        run: npm run build

      - name: 📂 Upload files via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.FRONTEND_USERNAME || secrets.USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FRONTEND_PASSWORD || secrets.PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.REMOTE_DIR || '/' }}
          dangerous-clean-slate: false
